---
# Runs when cPanel "Git Version Control" > "Deploy HEAD Commit" is clicked.
# The Node.js app in "Setup Node.js App" must use the application root "signaturecovers".
deployment:
  tasks:
    - export DEPLOYPATH=/home/thesignaturecove/signaturecovers
    - /bin/rsync -a --delete --exclude node_modules --exclude .next --exclude .git --exclude .env --exclude tmp ./ $DEPLOYPATH/
    - cd $DEPLOYPATH && . $(ls -d /home/thesignaturecove/nodevenv/signaturecovers/*/bin/activate | tail -1) && npm ci && npm run build
    - mkdir -p $DEPLOYPATH/tmp && touch $DEPLOYPATH/tmp/restart.txt
